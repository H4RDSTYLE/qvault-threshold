name: Publish Python to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qvault-threshold/
    permissions:
      id-token: write   # required for trusted publishing (no token needed)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python python/test_shamir.py

      - name: Build package
        run: |
          pip install build
          cd python && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          # Uses PyPI Trusted Publisher (OIDC) — no PYPI_TOKEN secret needed.
          # Configure at: https://pypi.org/manage/account/publishing/
          # Project: qvault-threshold  Owner: H4RDSTYLE  Workflow: publish-python.yml
          #
          # Alternatively, set PYPI_TOKEN secret and uncomment the line below:
          # password: ${{ secrets.PYPI_TOKEN }}
